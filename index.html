<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Portfolio Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ========== LANDING ========== -->
    <section id="landing">
        <div class="landing-content">
            <div class="landing-badge">✦ v2.0</div>
            <h1>Creative Portfolio Studio</h1>
            <p class="sub">Design your brand. Publish everywhere.</p>
            <div class="card-grid" id="formatGrid"></div>
            <button class="btn-primary" id="enterStudioBtn" disabled>
                Enter Studio <span class="arrow">→</span>
            </button>
        </div>
    </section>

    <!-- ========== WORKSPACE ========== -->
    <section id="workspace">
        <!-- Top Navigation -->
        <nav class="topnav">
            <div class="nav-left">
                <span class="brand">✦ Creative Studio</span>
                <span class="nav-format" id="navFormat">Website</span>
            </div>
            <div class="nav-center">
                <button class="nav-btn" id="undoBtn" title="Undo (⌘Z)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
                </button>
                <button class="nav-btn" id="redoBtn" title="Redo (⌘⇧Z)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3L21 13"/></svg>
                </button>
                <div class="nav-divider"></div>
                <button class="nav-btn" id="saveBtn" title="Save (⌘S)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
                </button>
            </div>
            <div class="nav-right">
                <button class="btn-publish" id="publishBtn">Publish</button>
            </div>
        </nav>

        <div class="workspace-body">
            <!-- Sidebar -->
            <nav class="sidebar" id="sidebar">
                <ul>
                    <li data-section="identity" class="active">
                        <span class="icon">👤</span>
                        <span class="label">Identity</span>
                    </li>
                    <li data-section="brand">
                        <span class="icon">🎨</span>
                        <span class="label">Brand</span>
                    </li>
                    <li data-section="showcases">
                        <span class="icon">📁</span>
                        <span class="label">Showcases</span>
                        <span class="badge-count" id="showcaseCount">1</span>
                    </li>
                    <li data-section="assets">
                        <span class="icon">🖼️</span>
                        <span class="label">Assets</span>
                        <span class="badge-count" id="assetCount">0</span>
                    </li>
                    <li data-section="seo">
                        <span class="icon">🔍</span>
                        <span class="label">SEO</span>
                    </li>
                </ul>
            </nav>

            <!-- Editor + Preview -->
            <div class="editor-panel">
                <div class="editor-area" id="editorArea"></div>
                <div class="preview-area">
                    <div class="preview-toolbar">
                        <div class="device-group">
                            <button data-device="desktop" class="active" title="Desktop">🖥</button>
                            <button data-device="tablet" title="Tablet">📱</button>
                            <button data-device="mobile" title="Mobile">📲</button>
                        </div>
                        <span class="preview-label">Live Preview</span>
                        <button class="refresh-btn" id="refreshPreview" title="Refresh Preview">⟳</button>
                    </div>
                    <div class="preview-frame" id="previewFrame">
                        <iframe id="previewIframe"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
